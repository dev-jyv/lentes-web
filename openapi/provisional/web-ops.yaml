# PROVISIONAL: lo que lentes-web necesita y lentes-api aún no publica (checkout, pedidos, recompra, recetas).
# Cuando la API lo publique en api/openapi.yaml: borrar este archivo, lib/api/provisional, scripts/mock-api.mjs
# y el desvío en lib/api/mutator.ts (ver docs/API-GAPS.md).
openapi: 3.0.3
info:
  title: Lentes API - operaciones de tienda (propuesta)
  version: 0.0.1
paths:
  /v1/checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      description: Valida precios y stock, aparta inventario, crea el pedido y la preferencia de Mercado Pago.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id]
              properties:
                address_id: { type: string, format: uuid }
                prescription_id: { type: string, format: uuid, nullable: true }
                turnstile_token: { type: string }
      responses:
        "200":
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                required: [order_id, init_point]
                properties:
                  order_id: { type: string, format: uuid }
                  init_point: { type: string, description: URL de Mercado Pago Checkout Pro }
        "409":
          description: Sin stock o cambió el precio
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/me/orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: No encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/me/orders/{id}/reorder:
    post:
      operationId: reorderOrder
      tags: [orders]
      description: Agrega al carrito del cliente los artículos de un pedido anterior. Lo no disponible se reporta en unavailable.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [added, unavailable]
                properties:
                  added: { type: integer, description: Renglones agregados al carrito }
                  unavailable:
                    type: array
                    items: { $ref: "#/components/schemas/UnavailableItem" }
        "404":
          description: No encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/me/prescriptions/upload-url:
    post:
      operationId: createPrescriptionUploadUrl
      tags: [prescriptions]
      description: URL prefirmada de R2 (PUT directo desde el navegador, 10 min, máx 10 MB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size_bytes]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                size_bytes: { type: integer, maximum: 10485760 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, r2_key]
                properties:
                  upload_url: { type: string }
                  r2_key: { type: string }
  /v1/me/prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Prescription" }
    post:
      operationId: createPrescription
      tags: [prescriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionInput" }
      responses:
        "201":
          description: Creada (queda pending hasta revisión)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prescription" }
components:
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Eye:
      type: string
      enum: [right, left, both]
    OrderStatus:
      type: string
      enum: [pending_payment, paid, preparing, shipped, delivered, cancelled, refunded, expired]
    OrderItem:
      type: object
      required: [product_name, brand_name, eye, quantity, unit_price_cents, base_curve, diameter]
      properties:
        product_name: { type: string }
        brand_name: { type: string }
        eye: { $ref: "#/components/schemas/Eye" }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64, description: Precio pagado en ese pedido }
        sphere: { type: number, nullable: true }
        cylinder: { type: number, nullable: true }
        axis: { type: integer, nullable: true }
        addition: { type: string, nullable: true }
        base_curve: { type: number }
        diameter: { type: number }
        color: { type: string, nullable: true }
    Order:
      type: object
      required: [id, number, status, total_cents]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total_cents: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    UnavailableItem:
      type: object
      required: [product_name, reason]
      properties:
        product_name: { type: string }
        reason: { type: string, enum: [out_of_stock, discontinued] }
    RxStatus:
      type: string
      enum: [pending, approved, rejected]
    PrescriptionInput:
      type: object
      required: [r2_key, od_sphere, os_sphere, issued_at, expires_at, doctor_name]
      properties:
        r2_key: { type: string }
        od_sphere: { type: number }
        od_cylinder: { type: number, nullable: true }
        od_axis: { type: integer, nullable: true }
        od_addition: { type: string, nullable: true }
        os_sphere: { type: number }
        os_cylinder: { type: number, nullable: true }
        os_axis: { type: integer, nullable: true }
        os_addition: { type: string, nullable: true }
        issued_at: { type: string, format: date }
        expires_at: { type: string, format: date }
        doctor_name: { type: string }
        doctor_license: { type: string, nullable: true }
    Prescription:
      allOf:
        - $ref: "#/components/schemas/PrescriptionInput"
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/RxStatus" }
            created_at: { type: string, format: date-time }
            reject_reason: { type: string, nullable: true }
