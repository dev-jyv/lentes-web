# PROVISIONAL: lo que lentes-web necesita y lentes-api aún no publica (solo la recompra).
# Cuando la API lo publique en api/openapi.yaml: borrar este archivo, lib/api/provisional, scripts/mock-api.mjs
# y el desvío en lib/api/mutator.ts (ver docs/API-GAPS.md).
openapi: 3.0.3
info:
  title: Lentes API - operaciones de tienda (propuesta)
  version: 0.0.1
paths:
  /v1/me/orders/{id}/reorder:
    post:
      operationId: reorderOrder
      tags: [orders]
      description: Agrega al carrito del cliente los artículos de un pedido anterior. Lo no disponible se reporta en unavailable.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [added, unavailable]
                properties:
                  added: { type: integer, description: Renglones agregados al carrito }
                  unavailable:
                    type: array
                    items: { $ref: "#/components/schemas/UnavailableItem" }
        "404":
          description: No encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    UnavailableItem:
      type: object
      required: [product_name, reason]
      properties:
        product_name: { type: string }
        reason: { type: string, enum: [out_of_stock, discontinued] }
