      operationId: adminUpdateVariant
      summary: "Reemplaza una variante (el producto no cambia; para retirarla, active=false)"
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "200":
          description: Variante actualizada
          content:
            application/json:
