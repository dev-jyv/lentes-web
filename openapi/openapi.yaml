          $ref: "#/components/responses/Problem"
  /v1/admin/variants/import:
    post:
      operationId: adminImportVariants
      summary: "Carga masiva de variantes por CSV (upsert por sku, todo o nada)"
      description: |
        Columnas: `product_slug,sku,sphere,cylinder,axis,addition,base_curve,diameter,color,price_cents,compare_at_cents,stock,active`.
        Requeridas: `product_slug`, `sku`, `base_curve`, `diameter`, `price_cents`, `stock`. Máximo 5 MB y 5,000 filas.
        El encabezado es la fila 1. Si hay errores no se aplica nada y se devuelven por fila.
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                required: [created, updated]
                properties:
                  created: { type: integer }
                  updated: { type: integer }
        "400":
          description: Archivo inválido; `errors` trae el detalle por fila
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ImportProblem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth. El scope `admin` exige app_metadata.role = admin.
  parameters:
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: Token del carrito anónimo
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    LensType:
      type: string
      enum: [spherical, toric, multifocal, cosmetic]
    Replacement:
      type: string
      enum: [daily, biweekly, monthly, quarterly, yearly]
    BannerPlacement:
      type: string
      enum: [promo_bar, hero, secondary]
    HomeBanner:
      type: object
      required: [id, placement, title, subtitle, cta_label, cta_href, image_url, image_alt]
      properties:
        id: { type: string, format: uuid }
        placement: { $ref: "#/components/schemas/BannerPlacement" }
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 240, nullable: true }
        cta_label: { type: string, maxLength: 40, nullable: true }
        cta_href: { type: string, maxLength: 200, nullable: true, description: Ruta interna; empieza con una sola diagonal. }
        image_url: { type: string, format: uri, nullable: true }
        image_alt: { type: string, maxLength: 160, nullable: true }
    AdminHomeBanner:
      allOf:
        - $ref: "#/components/schemas/HomeBanner"
        - type: object
          required: [image_key, position, active, starts_at, ends_at]
          properties:
            image_key: { type: string, nullable: true }
            position: { type: integer }
            active: { type: boolean }
            starts_at: { type: string, format: date-time, nullable: true }
            ends_at: { type: string, format: date-time, nullable: true }
    HomeBannerInput:
      type: object
      required: [placement, title, active]
      properties:
        placement: { $ref: "#/components/schemas/BannerPlacement" }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        cta_label: { type: string, nullable: true }
        cta_href: { type: string, nullable: true }
        image_key: { type: string, nullable: true }
        image_alt: { type: string, nullable: true }
