openapi: 3.0.3
info:
  title: Lentes API
  version: 0.1.0
  description: API de la tienda en línea de lentes de contacto. Fuente de verdad del contrato con lentes-web.
servers:
  - url: https://api.tutienda.com
    description: Producción
  - url: http://localhost:8080
    description: Local
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Salud del servicio
      responses:
        "200":
          description: Servicio y base de datos disponibles
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          $ref: "#/components/responses/Problem"
  /v1/products:
    get:
      operationId: listProducts
      summary: Catálogo con filtros y paginación por cursor
      parameters:
        - name: brand
          in: query
          description: Slug de la marca
          schema: { type: string }
        - name: lens_type
          in: query
          schema: { $ref: "#/components/schemas/LensType" }
        - name: replacement
          in: query
          schema: { $ref: "#/components/schemas/Replacement" }
        - name: cursor
          in: query
          description: Cursor opaco devuelto en `next_cursor`
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de productos
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/Problem"
  /v1/brands:
    get:
      operationId: listBrands
      summary: Lista de marcas
      responses:
        "200":
          description: Marcas ordenadas por nombre
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Brand" }
  /v1/products/{slug}:
    get:
      operationId: getProduct
      summary: Detalle del producto y parámetros disponibles
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Producto con imágenes y valores de graduación existentes
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/products/{slug}/variant:
    get:
      operationId: getProductVariant
      summary: Resuelve la variante por parámetros y devuelve precio y stock
      description: Los parámetros que no aplican al modelo (p. ej. `cylinder` en esféricos) se omiten.
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: sphere
          in: query
          schema: { type: number, format: double }
        - name: cylinder
          in: query
          schema: { type: number, format: double }
        - name: axis
          in: query
          schema: { type: integer, minimum: 0, maximum: 180 }
        - name: addition
          in: query
          schema: { type: string }
        - name: base_curve
          in: query
          required: true
          schema: { type: number, format: double }
        - name: diameter
          in: query
          required: true
          schema: { type: number, format: double }
        - name: color
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Variante encontrada
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/cart:
    get:
      operationId: getCart
      summary: Carrito actual (vacío si no existe)
      description: Con sesión es el carrito del cliente; sin sesión, el del header `X-Cart-Token`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: Carrito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /v1/cart/items:
    post:
      operationId: addCartItem
      summary: Agrega una variante para un ojo (suma si la línea ya existe)
      description: |
        Sin sesión ni token válido crea un carrito anónimo y devuelve `cart_token`; el cliente debe
        guardarlo y enviarlo en `X-Cart-Token`. Falla con 409 si no hay existencias suficientes.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemInput" }
      responses:
        "201":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/cart/items/{id}:
    patch:
      operationId: updateCartItem
      summary: Cambia la cantidad de una línea
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemUpdate" }
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCartItem
      summary: Quita una línea
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/cart/merge:
    post:
      operationId: mergeCart
      summary: Une el carrito anónimo (`X-Cart-Token`) al del cliente al iniciar sesión
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: Carrito del cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /v1/me:
    get:
      operationId: getMe
      summary: Perfil del cliente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    put:
      operationId: updateMe
      summary: Actualiza el perfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/me/addresses:
    get:
      operationId: listAddresses
      summary: Direcciones del cliente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Direcciones, la predeterminada primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
    post:
      operationId: createAddress
      summary: "Agrega una dirección (la primera queda predeterminada)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Dirección creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/me/addresses/{id}:
    put:
      operationId: updateAddress
      summary: Reemplaza una dirección
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: Dirección actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAddress
      summary: Elimina una dirección
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Eliminada
        "404":
          $ref: "#/components/responses/Problem"
  /v1/checkout:
    post:
      operationId: createCheckout
      summary: Valida el carrito, aparta inventario, crea el pedido y la preferencia de Mercado Pago
      description: |
        Aparta las existencias por 15 minutos y devuelve el `init_point` de Checkout Pro. Los precios salen de la base
        al momento de apartar (nunca del cliente). Un cliente tiene un solo pedido pendiente: crear otro libera el anterior.
        `409` si el carrito está vacío, no hay existencias (type `out-of-stock`), falta o no sirve la receta.
        `502` si Mercado Pago falla (el apartado se libera y se puede reintentar). Con Turnstile configurado exige `turnstile_token`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "201":
          description: Pedido creado; el cliente debe ir al init_point
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/me/orders/{id}:
    get:
      operationId: getOrder
      summary: Detalle de un pedido del cliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/orders/{id}/reorder:
    post:
      operationId: reorderOrder
      summary: Copia al carrito los artículos de un pedido anterior
      description: |
        Deja cada renglón del pedido en el carrito del cliente con **al menos** la cantidad pedida (no suma, así que repetir la acción no duplica).
        Es todo o nada por renglón: si la existencia no alcanza o el producto ya no se vende, no se agrega y se lista en `unavailable`.
        Se usa el precio vigente, no el que se pagó. No lleva la receta: se elige al pagar. Un pedido ajeno es `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Resultado de la recompra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderResult" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/webhooks/mercadopago:
    post:
      operationId: mercadoPagoWebhook
      summary: Notificaciones de pago de Mercado Pago
      description: |
        Sin sesión: se autentica con la firma `x-signature` (HMAC-SHA256 con el secreto del webhook, con tolerancia de reloj).
        El cuerpo nunca se usa para decidir: se consulta el pago a Mercado Pago y se valida referencia, monto y moneda.
        Es idempotente por id de notificación. Responde 200 aunque la notificación no cambie nada; 401 si la firma es inválida.
      security:
        - {}
      parameters:
        - name: x-signature
          in: header
          required: true
          schema: { type: string }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string }
        - name: data.id
          in: query
          required: true
          description: Id del pago; es el que firma Mercado Pago.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Recibida
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/prescriptions/upload-url:
    post:
      operationId: createPrescriptionUploadUrl
      summary: URL prefirmada de R2 para subir el archivo de una receta
      description: |
        El navegador sube el archivo directo a R2 con `PUT` (cabecera `Content-Type` igual a la declarada; el tamaño exacto va firmado).
        Vigencia 10 minutos, máximo 10 MB, solo JPG, PNG, WebP o PDF. Después se registra la receta con `POST /v1/me/prescriptions`.
        `409` si el cliente ya tiene 10 recetas en revisión. `503` si el almacenamiento no está configurado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionUploadInput" }
      responses:
        "200":
          description: URL de subida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrescriptionUpload" }
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/me/prescriptions:
    get:
      operationId: listPrescriptions
      summary: Recetas del cliente, la más reciente primero
      description: "`file_url` es una URL de lectura prefirmada de 10 minutos."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recetas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Prescription" }
    post:
      operationId: createPrescription
      summary: Registra una receta ya subida (queda pendiente de revisión)
      description: |
        Valida rangos y pasos de 0.25, eje con cilindro, fechas y vigencia, que el archivo sea del cliente y que exista en R2.
        La revisión clínica es del admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionInput" }
      responses:
        "201":
          description: Receta registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prescription" }
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/admin/prescriptions:
    get:
      operationId: adminListPrescriptions
      summary: Cola de revisión de recetas
      description: Pendientes de la más antigua a la más nueva; las demás, la más reciente primero. Máximo 100.
      security:
        - bearerAuth: [admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RxStatus" }
      responses:
        "200":
          description: Recetas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminPrescription" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/admin/prescriptions/{id}:
    patch:
      operationId: adminReviewPrescription
      summary: Aprueba o rechaza una receta pendiente
      description: Rechazar exige `reject_reason` (se le muestra al cliente). No se puede aprobar una receta vencida ni revisar dos veces (`409`).
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionReview" }
      responses:
        "200":
          description: Receta revisada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPrescription" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/orders:
    get:
      operationId: adminListOrders
      summary: Pedidos, el más reciente primero
      description: Filtra por estado y pagina por cursor (límite 1 a 100, 20 por defecto).
      security:
        - bearerAuth: [admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de pedidos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminOrderSummary" }
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/Problem"
  /v1/admin/orders/{id}:
    get:
      operationId: adminGetOrder
      summary: Detalle de un pedido
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: adminUpdateOrder
      summary: Cambia el estado de un pedido o corrige su guía
      description: |
        Transiciones: `paid` → `preparing` | `cancelled`; `preparing` → `shipped` | `cancelled`; `shipped` → `delivered`.
        `shipped` exige `tracking_carrier` y `tracking_number`. Con el pedido ya enviado se puede corregir la guía sin cambiar el estado.
        Cancelar un pedido que no salió devuelve su existencia al inventario; **no reembolsa**: el reembolso en Mercado Pago es manual (ver docs/ADMIN_ORDERS.md).
        `409` si la transición no es válida, falta la guía o el estado cambió mientras tanto.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderUpdate" }
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/uploads/image-url:
    post:
      operationId: adminCreateImageUploadUrl
      summary: URL prefirmada de R2 para subir una foto de producto
      description: |
        PUT directo desde el navegador al bucket público, 10 minutos, tamaño y tipo firmados. Solo JPG, PNG o WebP, máx. 5 MB.
        Después se registra con `POST /v1/admin/products/{id}/images`.
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadInput" }
      responses:
        "200":
          description: URL de subida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageUpload" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/admin/products/{id}/images:
    get:
      operationId: adminListProductImages
      summary: Galería del producto en orden (la primera es la principal)
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Imágenes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductImageAdmin" }
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminAddProductImage
      summary: Registra una imagen ya subida al final de la galería
      description: |
        La llave debe empezar con `productos/{id}/` y el archivo existir en R2 como imagen válida (tipo y ≤ 5 MB).
        `409` si la galería ya tiene 10 imágenes o el archivo ya está registrado. El catálogo público puede tardar hasta 5 minutos en reflejarlo (caché de borde).
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageAddInput" }
      responses:
        "201":
          description: Imagen registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductImageAdmin" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/admin/products/{id}/images/order:
    put:
      operationId: adminReorderProductImages
      summary: Define el orden completo de la galería
      description: Debe traer exactamente las imágenes actuales, sin repetir ni agregar ajenas (`400`).
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageOrderInput" }
      responses:
        "200":
          description: Galería reordenada
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductImageAdmin" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/admin/products/{id}/images/{imageId}:
    delete:
      operationId: adminDeleteProductImage
      summary: Quita una imagen de la galería
      description: Borra el registro y compacta las posiciones. El archivo en R2 se conserva.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Eliminada
        "404":
          $ref: "#/components/responses/Problem"
  /v1/admin/variants/{id}/stock-adjustments:
    get:
      operationId: adminListStockAdjustments
      summary: Historial de ajustes de existencia de una variante
      description: Los últimos 100, el más reciente primero.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Historial
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockAdjustment" }
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminCreateStockAdjustment
      summary: Ajusta la existencia de una variante con motivo
      description: |
        `delta` con signo (suma o resta, distinto de 0, máx. 100,000). Queda en una bitácora de solo agregar con quién, cuándo y cuánto quedó.
        `409` si la existencia quedaría negativa o por debajo de lo apartado por pedidos sin pagar. Con motivo `other` la nota es obligatoria.
        La carga masiva por CSV y la edición de una variante fijan la existencia directamente y **no** pasan por esta bitácora.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentInput" }
      responses:
        "201":
          description: Ajuste registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockAdjustment" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/inventory/low-stock:
    get:
      operationId: adminListLowStock
      summary: Variantes activas con poca existencia disponible
      description: Disponible = existencia − apartado, menor o igual al umbral (0 a 10,000; 5 por defecto). Las más urgentes primero, máximo 500.
      security:
        - bearerAuth: [admin]
      parameters:
        - name: threshold
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 5 }
      responses:
        "200":
          description: Variantes por reponer
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LowStockItem" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/admin/brands:
    post:
      operationId: adminCreateBrand
      summary: Crea una marca
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandInput" }
      responses:
        "201":
          description: Marca creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/products:
    get:
      operationId: adminListProducts
      summary: Productos, incluidos los inactivos
      security:
        - bearerAuth: [admin]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminProduct" }
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminCreateProduct
      summary: Crea un producto
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/products/{id}:
    put:
      operationId: adminUpdateProduct
      summary: "Reemplaza un producto (para retirarlo, active=false)"
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/variants:
    get:
      operationId: adminListVariants
      summary: Variantes de un producto, incluidas las inactivas
      security:
        - bearerAuth: [admin]
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Variantes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminVariant" }
    post:
      operationId: adminCreateVariant
      summary: Crea una variante
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "201":
          description: Variante creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVariant" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/variants/{id}:
    put:
      operationId: adminUpdateVariant
      summary: "Reemplaza una variante (el producto no cambia; para retirarla, active=false)"
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "200":
          description: Variante actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVariant" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/variants/import:
    post:
      operationId: adminImportVariants
      summary: "Carga masiva de variantes por CSV (upsert por sku, todo o nada)"
      description: |
        Columnas: `product_slug,sku,sphere,cylinder,axis,addition,base_curve,diameter,color,price_cents,compare_at_cents,stock,active`.
        Requeridas: `product_slug`, `sku`, `base_curve`, `diameter`, `price_cents`, `stock`. Máximo 5 MB y 5,000 filas.
        El encabezado es la fila 1. Si hay errores no se aplica nada y se devuelven por fila.
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                required: [created, updated]
                properties:
                  created: { type: integer }
                  updated: { type: integer }
        "400":
          description: Archivo inválido; `errors` trae el detalle por fila
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ImportProblem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth. El scope `admin` exige app_metadata.role = admin.
  parameters:
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: Token del carrito anónimo
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    LensType:
      type: string
      enum: [spherical, toric, multifocal, cosmetic]
    Replacement:
      type: string
      enum: [daily, biweekly, monthly, quarterly, yearly]
    Brand:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    Product:
      type: object
      required: [id, brand, name, slug, lens_type, replacement, pieces_per_box, requires_prescription, from_price_cents, image_url]
      properties:
        id: { type: string, format: uuid }
        brand: { $ref: "#/components/schemas/Brand" }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        lens_type: { $ref: "#/components/schemas/LensType" }
        replacement: { $ref: "#/components/schemas/Replacement" }
        pieces_per_box: { type: integer }
        material: { type: string, nullable: true }
        water_content_pct: { type: number, nullable: true }
        requires_prescription: { type: boolean }
        from_price_cents:
          type: integer
          format: int64
          nullable: true
          description: |
            Precio mínimo (centavos MXN) entre las variantes activas con existencia disponible (stock - reserved > 0).
            `null` si el modelo no tiene ninguna disponible (agotado).
        image_url:
          type: string
          format: uri
          nullable: true
          description: Imagen principal (la de menor posición); `null` si el modelo no tiene imágenes.
    ProductImage:
      type: object
      required: [url, position]
      properties:
        url: { type: string, format: uri }
        position: { type: integer }
    ProductOptions:
      description: Valores que existen en variantes activas del modelo, ordenados.
      type: object
      required: [spheres, cylinders, axes, additions, base_curves, diameters, colors]
      properties:
        spheres: { type: array, items: { type: number, format: double } }
        cylinders: { type: array, items: { type: number, format: double } }
        axes: { type: array, items: { type: integer } }
        additions: { type: array, items: { type: string } }
        base_curves: { type: array, items: { type: number, format: double } }
        diameters: { type: array, items: { type: number, format: double } }
        colors: { type: array, items: { type: string } }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [images, options]
          properties:
            images:
              type: array
              items: { $ref: "#/components/schemas/ProductImage" }
            options: { $ref: "#/components/schemas/ProductOptions" }
    Variant:
      type: object
      required: [id, sku, base_curve, diameter, price_cents, available, in_stock]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        sphere: { type: number, format: double, nullable: true }
        cylinder: { type: number, format: double, nullable: true }
        axis: { type: integer, nullable: true }
        addition: { type: string, nullable: true }
        base_curve: { type: number, format: double }
        diameter: { type: number, format: double }
        color: { type: string, nullable: true }
        price_cents: { type: integer, format: int64, description: Centavos MXN }
        compare_at_cents: { type: integer, format: int64, nullable: true }
        available: { type: integer, description: "stock - reserved" }
        in_stock: { type: boolean }
    ImportProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [row, message]
                properties:
                  row: { type: integer }
                  message: { type: string }
    Customer:
      type: object
      required: [email, marketing_opt_in, created_at]
      properties:
        email: { type: string }
        full_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        marketing_opt_in: { type: boolean }
        created_at: { type: string, format: date-time }
    CustomerUpdate:
      type: object
      required: [marketing_opt_in]
      properties:
        full_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        marketing_opt_in: { type: boolean }
    AddressInput:
      type: object
      required: [recipient, street, ext_number, neighborhood, city, state, postal_code, phone]
      properties:
        recipient: { type: string }
        street: { type: string }
        ext_number: { type: string }
        int_number: { type: string, nullable: true }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string, pattern: "^[0-9]{5}$" }
        phone: { type: string }
        is_default: { type: boolean, default: false }
    Address:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          required: [id, is_default]
          properties:
            id: { type: string, format: uuid }
            is_default: { type: boolean }
    BrandInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
    ProductInput:
      type: object
      required: [brand_id, name, slug, lens_type, replacement, pieces_per_box, requires_prescription, active]
      properties:
        brand_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        lens_type: { $ref: "#/components/schemas/LensType" }
        replacement: { $ref: "#/components/schemas/Replacement" }
        pieces_per_box: { type: integer }
        material: { type: string, nullable: true }
        water_content_pct: { type: number, nullable: true }
        requires_prescription: { type: boolean }
        active: { type: boolean }
    AdminProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [active]
          properties:
            active: { type: boolean }
    VariantInput:
      type: object
      required: [product_id, sku, base_curve, diameter, price_cents, stock, active]
      properties:
        product_id: { type: string, format: uuid }
        sku: { type: string }
        sphere: { type: number, format: double, nullable: true }
        cylinder: { type: number, format: double, nullable: true }
        axis: { type: integer, nullable: true }
        addition: { type: string, nullable: true }
        base_curve: { type: number, format: double }
        diameter: { type: number, format: double }
        color: { type: string, nullable: true }
        price_cents: { type: integer, format: int64 }
        compare_at_cents: { type: integer, format: int64, nullable: true }
        stock: { type: integer }
        active: { type: boolean }
    AdminVariant:
      allOf:
        - $ref: "#/components/schemas/Variant"
        - type: object
          required: [product_id, stock, reserved, active]
          properties:
            product_id: { type: string, format: uuid }
            stock: { type: integer }
            reserved: { type: integer }
            active: { type: boolean }
    CartItemInput:
      type: object
      required: [variant_id, eye, quantity]
      properties:
        variant_id: { type: string, format: uuid }
        eye: { $ref: "#/components/schemas/Eye" }
        quantity: { type: integer, minimum: 1, maximum: 12 }
    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 12 }
    Eye:
      type: string
      enum: [right, left, both]
    CartItem:
      type: object
      required: [id, variant_id, sku, eye, quantity, unit_price_cents, line_total_cents, available, purchasable, product, base_curve, diameter]
      properties:
        id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        sku: { type: string }
        eye: { $ref: "#/components/schemas/Eye" }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        available: { type: integer, description: "stock - reserved ahora mismo" }
        purchasable: { type: boolean, description: "false si la variante o el producto ya no están activos" }
        product:
          type: object
          required: [name, slug, brand, requires_prescription]
          properties:
            name: { type: string }
            slug: { type: string }
            brand: { type: string }
            image_url: { type: string, nullable: true }
            requires_prescription: { type: boolean }
        sphere: { type: number, format: double, nullable: true }
        cylinder: { type: number, format: double, nullable: true }
        axis: { type: integer, nullable: true }
        addition: { type: string, nullable: true }
        base_curve: { type: number, format: double }
        diameter: { type: number, format: double }
        color: { type: string, nullable: true }
    Cart:
      type: object
      required: [items, subtotal_cents, item_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        subtotal_cents: { type: integer, format: int64, description: Centavos MXN }
        item_count: { type: integer, description: Total de cajas }
        cart_token:
          type: string
          nullable: true
          description: Solo cuando se acaba de crear un carrito anónimo
    CheckoutInput:
      type: object
      required: [address_id]
      properties:
        address_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid, nullable: true }
        turnstile_token: { type: string }
    CheckoutResult:
      type: object
      required: [order_id, number, total_cents, init_point]
      properties:
        order_id: { type: string, format: uuid }
        number: { type: integer, format: int64, description: "Folio visible (LC-000123)" }
        total_cents: { type: integer, format: int64 }
        init_point: { type: string, format: uri, description: URL de Mercado Pago Checkout Pro }
    OrderStatus:
      type: string
      enum: [pending_payment, paid, preparing, shipped, delivered, cancelled, refunded, expired]
    OrderItem:
      type: object
      required: [product_name, brand_name, product_slug, sku, eye, quantity, unit_price_cents, base_curve, diameter]
      properties:
        product_name: { type: string }
        brand_name: { type: string }
        product_slug: { type: string }
        sku: { type: string }
        eye: { $ref: "#/components/schemas/Eye" }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64, description: Precio pagado en ese pedido }
        sphere: { type: number, format: double, nullable: true }
        cylinder: { type: number, format: double, nullable: true }
        axis: { type: integer, nullable: true }
        addition: { type: string, nullable: true }
        base_curve: { type: number, format: double }
        diameter: { type: number, format: double }
        color: { type: string, nullable: true }
    Order:
      type: object
      required: [id, number, status, subtotal_cents, shipping_cents, discount_cents, total_cents, created_at, items]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        subtotal_cents: { type: integer, format: int64 }
        shipping_cents: { type: integer, format: int64 }
        discount_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    RxStatus:
      type: string
      enum: [pending, approved, rejected]
    PrescriptionUploadInput:
      type: object
      required: [content_type, size_bytes]
      properties:
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 10485760 }
    PrescriptionUpload:
      type: object
      required: [upload_url, r2_key, expires_in]
      properties:
        upload_url: { type: string, format: uri }
        r2_key: { type: string, description: Llave que se manda al registrar la receta }
        expires_in: { type: integer, description: Segundos de vigencia de la URL }
    PrescriptionFields:
      type: object
      required: [od_sphere, os_sphere, issued_at, expires_at, doctor_name]
      properties:
        od_sphere: { type: number, format: double }
        od_cylinder: { type: number, format: double, nullable: true }
        od_axis: { type: integer, nullable: true }
        od_addition: { type: string, nullable: true }
        os_sphere: { type: number, format: double }
        os_cylinder: { type: number, format: double, nullable: true }
        os_axis: { type: integer, nullable: true }
        os_addition: { type: string, nullable: true }
        issued_at: { type: string, format: date }
        expires_at: { type: string, format: date }
        doctor_name: { type: string }
        doctor_license: { type: string, nullable: true }
    PrescriptionInput:
      allOf:
        - $ref: "#/components/schemas/PrescriptionFields"
        - type: object
          required: [r2_key]
          properties:
            r2_key: { type: string, description: Llave devuelta por upload-url; debe ser del cliente y existir en R2 }
    Prescription:
      allOf:
        - $ref: "#/components/schemas/PrescriptionFields"
        - type: object
          required: [id, status, created_at, file_url, reject_reason]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/RxStatus" }
            created_at: { type: string, format: date-time }
            reject_reason: { type: string, nullable: true }
            file_url: { type: string, format: uri, nullable: true, description: "URL de lectura prefirmada, de corta vida" }
    AdminPrescription:
      allOf:
        - $ref: "#/components/schemas/Prescription"
        - type: object
          required: [customer_email]
          properties:
            customer_email: { type: string }
    PrescriptionReview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected] }
        reject_reason: { type: string, maxLength: 500, description: Obligatorio al rechazar }
    AdminOrderSummary:
      type: object
      required: [id, number, status, total_cents, customer_email, created_at, paid_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, description: "Folio visible (LC-000123)" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total_cents: { type: integer, format: int64 }
        customer_email: { type: string }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
    AdminOrderLine:
      type: object
      required: [sku, product_name, brand_name, eye, quantity, unit_price_cents, description]
      properties:
        sku: { type: string }
        product_name: { type: string }
        brand_name: { type: string }
        eye: { $ref: "#/components/schemas/Eye" }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64 }
        description: { type: string, description: "Parámetros al comprar, p. ej. Esf -2.00 · CB 8.6 · Diám 14.2" }
    ShippingAddress:
      type: object
      required: [recipient, street, ext_number, neighborhood, city, state, postal_code, phone]
      properties:
        recipient: { type: string }
        street: { type: string }
        ext_number: { type: string }
        int_number: { type: string, nullable: true }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        phone: { type: string }
    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/AdminOrderSummary"
        - type: object
          required: [items, subtotal_cents, shipping_cents, discount_cents, shipping_address, prescription_id, mp_payment_id, tracking_carrier, tracking_number, shipped_at]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminOrderLine" }
            subtotal_cents: { type: integer, format: int64 }
            shipping_cents: { type: integer, format: int64 }
            discount_cents: { type: integer, format: int64 }
            shipping_address: { $ref: "#/components/schemas/ShippingAddress" }
            prescription_id: { type: string, format: uuid, nullable: true }
            mp_payment_id: { type: string, nullable: true }
            tracking_carrier: { type: string, nullable: true }
            tracking_number: { type: string, nullable: true }
            shipped_at: { type: string, format: date-time, nullable: true }
    OrderUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        tracking_carrier: { type: string, maxLength: 60 }
        tracking_number: { type: string, maxLength: 80 }
    ProductImageAdmin:
      type: object
      required: [id, r2_key, url, position]
      properties:
        id: { type: string, format: uuid }
        r2_key: { type: string }
        url: { type: string, format: uri, description: URL pública (R2_PUBLIC_BASE_URL) }
        position: { type: integer }
    ImageUploadInput:
      type: object
      required: [product_id, content_type, size_bytes]
      properties:
        product_id: { type: string, format: uuid }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 5242880 }
    ImageUpload:
      type: object
      required: [upload_url, r2_key]
      properties:
        upload_url: { type: string, format: uri }
        r2_key: { type: string, description: Llave que se manda al registrar la imagen }
    ImageAddInput:
      type: object
      required: [r2_key]
      properties:
        r2_key: { type: string }
    ImageOrderInput:
      type: object
      required: [image_ids]
      properties:
        image_ids:
          type: array
          items: { type: string, format: uuid }
    StockReason:
      type: string
      enum: [receipt, count_correction, damage, return, other]
    StockAdjustmentInput:
      type: object
      required: [delta, reason]
      properties:
        delta: { type: integer, description: "Positivo suma, negativo resta; no puede ser 0" }
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, maxLength: 500, description: Obligatoria si reason=other }
    StockAdjustment:
      type: object
      required: [id, delta, reason, note, stock_after, created_at, actor_email]
      properties:
        id: { type: string, format: uuid }
        delta: { type: integer }
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, nullable: true }
        stock_after: { type: integer, description: Existencia resultante }
        created_at: { type: string, format: date-time }
        actor_email: { type: string }
    LowStockItem:
      type: object
      required: [variant_id, sku, product_id, product_name, brand_name, stock, reserved, available]
      properties:
        variant_id: { type: string, format: uuid }
        sku: { type: string }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        brand_name: { type: string }
        stock: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    UnavailableItem:
      type: object
      required: [product_name, reason]
      properties:
        product_name: { type: string }
        reason: { type: string, enum: [out_of_stock, discontinued] }
    ReorderResult:
      type: object
      required: [added, unavailable]
      properties:
        added: { type: integer, description: Renglones del pedido que quedaron en el carrito (incluye los que ya estaban) }
        unavailable:
          type: array
          items: { $ref: "#/components/schemas/UnavailableItem" }
