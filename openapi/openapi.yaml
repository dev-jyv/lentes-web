    ShippingAddress:
      type: object
      required: [recipient, street, ext_number, neighborhood, city, state, postal_code, phone]
      properties:
        recipient: { type: string }
        street: { type: string }
        ext_number: { type: string }
        int_number: { type: string, nullable: true }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        phone: { type: string }
    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/AdminOrderSummary"
        - type: object
          required: [items, subtotal_cents, shipping_cents, discount_cents, shipping_address, prescription_id, mp_payment_id, tracking_carrier, tracking_number, shipped_at, glasses_prescription_id, glasses_prescription_status, pd_mm, refund_required, prescription_file_url, glasses_prescription_file_url, lab_blockers]
          properties:
            glasses_prescription_id: { type: string, format: uuid, nullable: true }
            glasses_prescription_status: { allOf: [{ $ref: "#/components/schemas/RxStatus" }], nullable: true }
            pd_mm: { type: number, format: double, nullable: true }
            refund_required: { type: boolean, description: "Pedido pagado con receta de armazones rechazada: requiere reembolso manual." }
            prescription_file_url: { type: string, format: uri, nullable: true, description: "URL de lectura de corta vida" }
            glasses_prescription_file_url: { type: string, format: uri, nullable: true, description: "URL de lectura de corta vida" }
            lab_blockers:
              type: array
              description: Motivos por los que el pedido no puede pasar a `preparing`.
              items: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminOrderLine" }
            subtotal_cents: { type: integer, format: int64 }
            shipping_cents: { type: integer, format: int64 }
            discount_cents: { type: integer, format: int64 }
            shipping_address: { $ref: "#/components/schemas/ShippingAddress" }
            prescription_id: { type: string, format: uuid, nullable: true }
            mp_payment_id: { type: string, nullable: true }
            tracking_carrier: { type: string, nullable: true }
            tracking_number: { type: string, nullable: true }
            shipped_at: { type: string, format: date-time, nullable: true }
    OrderUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        tracking_carrier: { type: string, maxLength: 60 }
        tracking_number: { type: string, maxLength: 80 }
    ProductImageAdmin:
      type: object
      required: [id, r2_key, url, position]
      properties:
        id: { type: string, format: uuid }
        r2_key: { type: string }
        url: { type: string, format: uri, description: URL pública (R2_PUBLIC_BASE_URL) }
        position: { type: integer }
    ImageUploadInput:
      type: object
      required: [product_id, content_type, size_bytes]
      properties:
        product_id: { type: string, format: uuid }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 5242880 }
    ImageUpload:
      type: object
      required: [upload_url, r2_key]
      properties:
        upload_url: { type: string, format: uri }
        r2_key: { type: string, description: Llave que se manda al registrar la imagen }
    ImageAddInput:
      type: object
      required: [r2_key]
      properties:
        r2_key: { type: string }
    ImageOrderInput:
      type: object
      required: [image_ids]
      properties:
        image_ids:
          type: array
          items: { type: string, format: uuid }
    ManualStockReason:
      type: string
      enum: [receipt, count_correction, damage, return, other]
    StockReason:
      type: string
      description: "Los cinco manuales más los que registra el sistema (initial = alta de variante, edit = edición directa, import = carga masiva)."
      enum: [receipt, count_correction, damage, return, other, initial, edit, import]
    StockAdjustmentInput:
      type: object
      required: [delta, reason]
      properties:
        delta: { type: integer, description: "Positivo suma, negativo resta; no puede ser 0" }
        reason: { $ref: "#/components/schemas/ManualStockReason" }
        note: { type: string, maxLength: 500, description: Obligatoria si reason=other }
    StockAdjustment:
      type: object
      required: [id, delta, reason, note, stock_after, created_at, actor_email]
      properties:
        id: { type: string, format: uuid }
        delta: { type: integer }
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, nullable: true }
        stock_after: { type: integer, description: Existencia resultante }
        created_at: { type: string, format: date-time }
        actor_email: { type: string }
    SalesReport:
      type: object
      required: [orders, revenue_cents, units, daily, top_products]
      properties:
        orders: { type: integer }
        revenue_cents: { type: integer, format: int64 }
        units: { type: integer, description: "Cajas vendidas" }
        daily:
          type: array
          items:
            type: object
            required: [date, orders, revenue_cents]
            properties:
              date: { type: string, format: date }
              orders: { type: integer }
              revenue_cents: { type: integer, format: int64 }
        top_products:
          type: array
          items:
            type: object
            required: [product_name, brand_name, units, revenue_cents]
            properties:
              product_name: { type: string }
              brand_name: { type: string }
              units: { type: integer }
              revenue_cents: { type: integer, format: int64 }
    RepurchaseReport:
      type: object
      required: [customers, repeat_customers, reminders_sent, reorders_from_reminder]
      properties:
        customers: { type: integer }
        repeat_customers: { type: integer }
        reminders_sent: { type: integer }
        reorders_from_reminder: { type: integer }
    LowStockItem:
      type: object
      required: [variant_id, sku, product_id, product_name, brand_name, stock, reserved, available]
      properties:
        variant_id: { type: string, format: uuid }
        sku: { type: string }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        brand_name: { type: string }
        stock: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    UnavailableItem:
      type: object
      required: [product_name, reason]
      properties:
        product_name: { type: string }
        reason: { type: string, enum: [out_of_stock, discontinued, not_reorderable] }
    ReorderResult:
      type: object
      required: [added, unavailable]
      properties:
        added: { type: integer, description: Renglones del pedido que quedaron en el carrito (incluye los que ya estaban) }
        unavailable:
          type: array
          items: { $ref: "#/components/schemas/UnavailableItem" }
