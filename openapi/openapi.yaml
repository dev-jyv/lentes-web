openapi: 3.0.3
info:
  title: Lentes API
  version: 0.1.0
  description: API de la tienda en línea de lentes de contacto. Fuente de verdad del contrato con lentes-web.
servers:
  - url: https://api.tutienda.com
    description: Producción
  - url: http://localhost:8080
    description: Local
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Salud del servicio
      responses:
        "200":
          description: Servicio y base de datos disponibles
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          $ref: "#/components/responses/Problem"
  /v1/products:
    get:
      operationId: listProducts
      summary: Catálogo con filtros y paginación por cursor
      parameters:
        - name: brand
          in: query
          description: Slug de la marca
          schema: { type: string }
        - name: lens_type
          in: query
          schema: { $ref: "#/components/schemas/LensType" }
        - name: replacement
          in: query
          schema: { $ref: "#/components/schemas/Replacement" }
        - name: category
          in: query
          description: Sin este parámetro se devuelven todas las categorías.
          schema: { $ref: "#/components/schemas/ProductCategory" }
        - name: q
          in: query
          description: Busca en nombre de producto y de marca, sin distinguir mayúsculas ni acentos. De 2 a 80 caracteres tras recortar.
          schema: { type: string }
        - name: shape
          in: query
          schema: { $ref: "#/components/schemas/FrameShape" }
        - name: frame_material
          in: query
          schema: { $ref: "#/components/schemas/FrameMaterial" }
        - name: rim
          in: query
          schema: { $ref: "#/components/schemas/FrameRim" }
        - name: gender
          in: query
          schema: { $ref: "#/components/schemas/FrameGender" }
        - name: color
          in: query
          schema: { $ref: "#/components/schemas/FrameColor" }
        - name: min_price_cents
          in: query
          description: Se aplica sobre `from_price_cents`; excluye agotados.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: max_price_cents
          in: query
          description: Se aplica sobre `from_price_cents`; excluye agotados.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: cursor
          in: query
          description: Cursor opaco devuelto en `next_cursor`
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de productos
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/Problem"
  /v1/brands:
    get:
      operationId: listBrands
      summary: Lista de marcas
      parameters:
        - name: category
          in: query
          description: Devuelve solo marcas con al menos un producto activo de esa categoría.
          schema: { $ref: "#/components/schemas/ProductCategory" }
      responses:
        "200":
          description: Marcas ordenadas por nombre
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Brand" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/catalog/facets:
    get:
      operationId: getCatalogFacets
      summary: Valores de filtro con productos activos en una categoría
      parameters:
        - name: category
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ProductCategory" }
      responses:
        "200":
          description: Facetas con su conteo
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFacets" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/home:
    get:
      operationId: getHome
      summary: Contenido vigente del home
      responses:
        "200":
          description: Barra promocional, banners y destacados vigentes
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeContent" }
  /v1/products/{slug}:
    get:
      operationId: getProduct
      summary: Detalle del producto y parámetros disponibles
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Producto con imágenes y valores de graduación existentes
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/products/{slug}/variant:
    get:
      operationId: getProductVariant
      summary: Resuelve la variante por parámetros y devuelve precio y stock
      description: Los parámetros que no aplican al modelo (p. ej. `cylinder` en esféricos) se omiten.
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: sphere
          in: query
          schema: { type: number, format: double }
        - name: cylinder
          in: query
          schema: { type: number, format: double }
        - name: axis
          in: query
          schema: { type: integer, minimum: 0, maximum: 180 }
        - name: addition
          in: query
          schema: { type: string }
        - name: base_curve
          in: query
          required: true
          schema: { type: number, format: double }
        - name: diameter
          in: query
          required: true
          schema: { type: number, format: double }
        - name: color
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Variante encontrada
          headers:
            Cache-Control:
              schema: { type: string, example: "public, s-maxage=300" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/cart:
    get:
      operationId: getCart
      summary: Carrito actual (vacío si no existe)
      description: Con sesión es el carrito del cliente; sin sesión, el del header `X-Cart-Token`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: Carrito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /v1/cart/items:
    post:
      operationId: addCartItem
      summary: Agrega una variante para un ojo (suma si la línea ya existe)
      description: |
        Sin sesión ni token válido crea un carrito anónimo y devuelve `cart_token`; el cliente debe
        guardarlo y enviarlo en `X-Cart-Token`. Falla con 409 si no hay existencias suficientes.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemInput" }
      responses:
        "201":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/cart/items/{id}:
    patch:
      operationId: updateCartItem
      summary: Cambia la cantidad de una línea
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemUpdate" }
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCartItem
      summary: Quita una línea
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/cart/merge:
    post:
      operationId: mergeCart
      summary: Une el carrito anónimo (`X-Cart-Token`) al del cliente al iniciar sesión
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: Carrito del cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /v1/me:
    get:
      operationId: getMe
      summary: Perfil del cliente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    put:
      operationId: updateMe
      summary: Actualiza el perfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/me/addresses:
    get:
      operationId: listAddresses
      summary: Direcciones del cliente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Direcciones, la predeterminada primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
    post:
      operationId: createAddress
      summary: "Agrega una dirección (la primera queda predeterminada)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Dirección creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/me/addresses/{id}:
    put:
      operationId: updateAddress
      summary: Reemplaza una dirección
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: Dirección actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAddress
      summary: Elimina una dirección
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Eliminada
        "404":
          $ref: "#/components/responses/Problem"
  /v1/checkout:
    post:
      operationId: createCheckout
      summary: Valida el carrito, aparta inventario, crea el pedido y la preferencia de Mercado Pago
      description: |
        Aparta las existencias por 15 minutos y devuelve el `init_point` de Checkout Pro. Los precios salen de la base
        al momento de apartar (nunca del cliente). Un cliente tiene un solo pedido pendiente: crear otro libera el anterior.
        `409` si el carrito está vacío, no hay existencias (type `out-of-stock`), falta o no sirve la receta.
        `502` si Mercado Pago falla (el apartado se libera y se puede reintentar). Con Turnstile configurado exige `turnstile_token`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "201":
          description: Pedido creado; el cliente debe ir al init_point
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/me/orders:
    get:
      operationId: listMyOrders
      summary: Historial de pedidos del cliente
      description: Del más reciente al más antiguo, paginado por cursor. No incluye pedidos vencidos (`expired`).
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de pedidos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrderSummary" }
                  next_cursor: { type: string }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/me/orders/{id}:
    get:
      operationId: getOrder
      summary: Detalle de un pedido del cliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/orders/{id}/reorder:
    post:
      operationId: reorderOrder
      summary: Copia al carrito los artículos de un pedido anterior
      description: |
        Deja cada renglón del pedido en el carrito del cliente con **al menos** la cantidad pedida (no suma, así que repetir la acción no duplica).
        Es todo o nada por renglón: si la existencia no alcanza o el producto ya no se vende, no se agrega y se lista en `unavailable`.
        Se usa el precio vigente, no el que se pagó. No lleva la receta: se elige al pagar. Un pedido ajeno es `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Resultado de la recompra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderResult" }
        "404":
          $ref: "#/components/responses/Problem"
  /v1/webhooks/mercadopago:
    post:
      operationId: mercadoPagoWebhook
      summary: Notificaciones de pago de Mercado Pago
      description: |
        Sin sesión: se autentica con la firma `x-signature` (HMAC-SHA256 con el secreto del webhook, con tolerancia de reloj).
        El cuerpo nunca se usa para decidir: se consulta el pago a Mercado Pago y se valida referencia, monto y moneda.
        Es idempotente por id de notificación. Responde 200 aunque la notificación no cambie nada; 401 si la firma es inválida.
      security:
        - {}
      parameters:
        - name: x-signature
          in: header
          required: true
          schema: { type: string }
        - name: x-request-id
          in: header
          required: false
          description: Si Mercado Pago no lo manda, se omite del manifiesto firmado.
          schema: { type: string }
        - name: data.id
          in: query
          required: true
          description: Id del pago; es el que firma Mercado Pago.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Recibida
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/prescriptions/upload-url:
    post:
      operationId: createPrescriptionUploadUrl
      summary: URL prefirmada de R2 para subir el archivo de una receta
      description: |
        El navegador sube el archivo directo a R2 con `PUT` (cabecera `Content-Type` igual a la declarada; el tamaño exacto va firmado).
        Vigencia 10 minutos, máximo 10 MB, solo JPG, PNG, WebP o PDF. Después se registra la receta con `POST /v1/me/prescriptions`.
        `409` si el cliente ya tiene 10 recetas en revisión. `503` si el almacenamiento no está configurado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionUploadInput" }
      responses:
        "200":
          description: URL de subida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrescriptionUpload" }
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/me/prescriptions:
    get:
      operationId: listPrescriptions
      summary: Recetas del cliente, la más reciente primero
      description: "`file_url` es una URL de lectura prefirmada de 10 minutos."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recetas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Prescription" }
    post:
      operationId: createPrescription
      summary: Registra una receta ya subida (queda pendiente de revisión)
      description: |
        Valida rangos y pasos de 0.25, eje con cilindro, fechas y vigencia, que el archivo sea del cliente y que exista en R2.
        La revisión clínica es del admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionInput" }
      responses:
        "201":
          description: Receta registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prescription" }
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/admin/prescriptions:
    get:
      operationId: adminListPrescriptions
      summary: Cola de revisión de recetas
      description: Pendientes de la más antigua a la más nueva; las demás, la más reciente primero. Máximo 100.
      security:
        - bearerAuth: [admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RxStatus" }
      responses:
        "200":
          description: Recetas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminPrescription" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/admin/prescriptions/{id}:
    patch:
      operationId: adminReviewPrescription
      summary: Aprueba o rechaza una receta pendiente
      description: Rechazar exige `reject_reason` (se le muestra al cliente). No se puede aprobar una receta vencida ni revisar dos veces (`409`).
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionReview" }
      responses:
        "200":
          description: Receta revisada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPrescription" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/orders:
    get:
      operationId: adminListOrders
      summary: Pedidos, el más reciente primero
      description: Filtra por estado y pagina por cursor (límite 1 a 100, 20 por defecto).
      security:
        - bearerAuth: [admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de pedidos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminOrderSummary" }
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/Problem"
  /v1/admin/orders/{id}:
    get:
      operationId: adminGetOrder
      summary: Detalle de un pedido
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: adminUpdateOrder
      summary: Cambia el estado de un pedido o corrige su guía
      description: |
        Transiciones: `paid` → `preparing` | `cancelled`; `preparing` → `shipped` | `cancelled`; `shipped` → `delivered`.
        `shipped` exige `tracking_carrier` y `tracking_number`. Con el pedido ya enviado se puede corregir la guía sin cambiar el estado.
        Cancelar un pedido que no salió devuelve su existencia al inventario; **no reembolsa**: el reembolso en Mercado Pago es manual (ver docs/ADMIN_ORDERS.md).
        Un pedido con micas graduadas no pasa a `preparing` sin receta de armazones aprobada y con distancia pupilar.
        `409` si la transición no es válida, falta la guía, la receta no está lista o el estado cambió mientras tanto.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderUpdate" }
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/uploads/image-url:
    post:
      operationId: adminCreateImageUploadUrl
      summary: URL prefirmada de R2 para subir una foto de producto
      description: |
        PUT directo desde el navegador al bucket público, 10 minutos, tamaño y tipo firmados. Solo JPG, PNG o WebP, máx. 5 MB.
        Después se registra con `POST /v1/admin/products/{id}/images`.
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadInput" }
      responses:
        "200":
          description: URL de subida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageUpload" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/admin/products/{id}/images:
    get:
      operationId: adminListProductImages
      summary: Galería del producto en orden (la primera es la principal)
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Imágenes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductImageAdmin" }
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminAddProductImage
      summary: Registra una imagen ya subida al final de la galería
      description: |
        La llave debe empezar con `productos/{id}/` y el archivo existir en R2 como imagen válida (tipo y ≤ 5 MB).
        `409` si la galería ya tiene 10 imágenes o el archivo ya está registrado. El catálogo público puede tardar hasta 5 minutos en reflejarlo (caché de borde).
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageAddInput" }
      responses:
        "201":
          description: Imagen registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductImageAdmin" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/admin/products/{id}/images/order:
    put:
      operationId: adminReorderProductImages
      summary: Define el orden completo de la galería
      description: Debe traer exactamente las imágenes actuales, sin repetir ni agregar ajenas (`400`).
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageOrderInput" }
      responses:
        "200":
          description: Galería reordenada
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductImageAdmin" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/admin/products/{id}/images/{imageId}:
    delete:
      operationId: adminDeleteProductImage
      summary: Quita una imagen de la galería
      description: Borra el registro y compacta las posiciones. El archivo en R2 se conserva.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Eliminada
        "404":
          $ref: "#/components/responses/Problem"
  /v1/admin/variants/{id}/stock-adjustments:
    get:
      operationId: adminListStockAdjustments
      summary: Historial de ajustes de existencia de una variante
      description: Los últimos 100, el más reciente primero.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Historial
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockAdjustment" }
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminCreateStockAdjustment
      summary: Ajusta la existencia de una variante con motivo
      description: |
        `delta` con signo (suma o resta, distinto de 0, máx. 100,000). Queda en una bitácora de solo agregar con quién, cuándo y cuánto quedó.
        `409` si la existencia quedaría negativa o por debajo de lo apartado por pedidos sin pagar. Con motivo `other` la nota es obligatoria.
        La carga masiva por CSV y la edición de una variante fijan la existencia directamente y **no** pasan por esta bitácora.
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentInput" }
      responses:
        "201":
          description: Ajuste registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockAdjustment" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/inventory/low-stock:
    get:
      operationId: adminListLowStock
      summary: Variantes activas con poca existencia disponible
      description: Disponible = existencia − apartado, menor o igual al umbral (0 a 10,000; 5 por defecto). Las más urgentes primero, máximo 500.
      security:
        - bearerAuth: [admin]
      parameters:
        - name: threshold
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 5 }
      responses:
        "200":
          description: Variantes por reponer
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LowStockItem" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/admin/reports/sales:
    get:
      operationId: adminSalesReport
      summary: Ventas del rango
      description: >
        Pedidos pagados en adelante (paid, preparing, shipped, delivered; sin cancelados, reembolsados ni expirados) cuyo pago cae en el rango.
        Días calendario en America/Mexico_City, `to` inclusivo, máximo 366 días. El ingreso es el total cobrado (incluye envío).
        `daily` trae un renglón por día, con ceros; `top_products` los 10 más vendidos por cajas.
      security:
        - bearerAuth: [admin]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Reporte de ventas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/admin/reports/repurchase:
    get:
      operationId: adminRepurchaseReport
      summary: Recompra del rango
      description: >
        Mismas reglas de fechas que ventas. `customers`: clientes con compra pagada en el rango; `repeat_customers`: de ellos, los que ya habían comprado antes del rango.
        `reminders_sent`: recordatorios enviados en el rango; `reorders_from_reminder`: de esos, los de clientes que pagaron otro pedido después del recordatorio.
        El pedido no guarda de qué enlace vino, así que la atribución es por tiempo, no por clic.
      security:
        - bearerAuth: [admin]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Reporte de recompra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepurchaseReport" }
        "400":
          $ref: "#/components/responses/Problem"
