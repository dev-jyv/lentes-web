# Contrato provisional. Reemplazar por copia de lentes-api/api/openapi.yaml.
openapi: 3.0.3
info:
  title: Lentes API
  version: 0.1.0
servers:
  - url: http://localhost:8080/v1
paths:
  /brands:
    get:
      operationId: listBrands
      tags: [catalog]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Brand" }
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      parameters:
        - { name: brand, in: query, schema: { type: string } }
        - { name: lens_type, in: query, schema: { $ref: "#/components/schemas/LensType" } }
        - { name: replacement, in: query, schema: { $ref: "#/components/schemas/Replacement" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductSummary" }
                  next_cursor: { type: string, nullable: true }
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404":
          description: No encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /products/{slug}/variant:
    get:
      operationId: resolveVariant
      tags: [catalog]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: sphere, in: query, schema: { type: number } }
        - { name: cylinder, in: query, schema: { type: number } }
        - { name: axis, in: query, schema: { type: integer } }
        - { name: addition, in: query, schema: { type: string } }
        - { name: base_curve, in: query, schema: { type: number } }
        - { name: diameter, in: query, schema: { type: number } }
        - { name: color, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
        "404":
          description: Sin variante
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      description: Carrito actual. Anónimo con header X-Cart-Token; el backend devuelve el token en el header X-Cart-Token de la respuesta.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      description: eye=both significa la misma variante para ambos ojos; quantity son cajas por ojo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItem" }
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "409":
          description: Sin stock
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      operationId: removeCartItem
      tags: [cart]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/merge:
    post:
      operationId: mergeCart
      tags: [cart]
      description: Requiere sesión. Une el carrito anónimo (X-Cart-Token) al del cliente.
      responses:
        "200":
          description: Carrito unido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /me/addresses:
    get:
      operationId: listAddresses
      tags: [me]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
    post:
      operationId: createAddress
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      description: Valida precios y stock, aparta inventario, crea el pedido y la preferencia de Mercado Pago.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id]
              properties:
                address_id: { type: string }
                prescription_id: { type: string, nullable: true }
                turnstile_token: { type: string }
      responses:
        "200":
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                required: [order_id, init_point]
                properties:
                  order_id: { type: string }
                  init_point: { type: string, description: URL de Mercado Pago Checkout Pro }
        "409":
          description: Sin stock o precios cambiaron
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/orders/{id}:
    get:
      operationId: getOrder
      tags: [me]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: No encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    LensType:
      type: string
      enum: [spherical, toric, multifocal, cosmetic]
    Replacement:
      type: string
      enum: [daily, biweekly, monthly, quarterly, yearly]
    Brand:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    ProductSummary:
      type: object
      required: [id, name, slug, brand, lens_type, replacement, pieces_per_box, from_price_cents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        brand: { $ref: "#/components/schemas/Brand" }
        lens_type: { $ref: "#/components/schemas/LensType" }
        replacement: { $ref: "#/components/schemas/Replacement" }
        pieces_per_box: { type: integer }
        from_price_cents: { type: integer, format: int64 }
        image_key: { type: string, nullable: true }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [images, options, requires_prescription]
          properties:
            description: { type: string, nullable: true }
            material: { type: string, nullable: true }
            water_content_pct: { type: number, nullable: true }
            requires_prescription: { type: boolean }
            images:
              type: array
              items: { type: string }
            options: { $ref: "#/components/schemas/ProductOptions" }
    ProductOptions:
      type: object
      description: Valores realmente disponibles para este modelo.
      required: [spheres, base_curves, diameters]
      properties:
        spheres: { type: array, items: { type: number } }
        cylinders: { type: array, items: { type: number } }
        axes: { type: array, items: { type: integer } }
        additions: { type: array, items: { type: string } }
        base_curves: { type: array, items: { type: number } }
        diameters: { type: array, items: { type: number } }
        colors: { type: array, items: { type: string } }
    Variant:
      type: object
      required: [id, sku, price_cents, available]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        price_cents: { type: integer, format: int64 }
        compare_at_cents: { type: integer, format: int64, nullable: true }
        available: { type: integer, description: stock - reserved }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Eye:
      type: string
      enum: [right, left, both]
    AddCartItem:
      type: object
      required: [variant_id, eye, quantity]
      properties:
        variant_id: { type: string }
        eye: { $ref: "#/components/schemas/Eye" }
        quantity: { type: integer, minimum: 1, maximum: 12 }
    CartItem:
      type: object
      required: [id, variant_id, eye, quantity, unit_price_cents, line_total_cents, product_name, brand_name, params]
      properties:
        id: { type: string }
        variant_id: { type: string }
        eye: { $ref: "#/components/schemas/Eye" }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        product_name: { type: string }
        product_slug: { type: string }
        brand_name: { type: string }
        params:
          type: object
          description: Parámetros de la variante tal como los muestra el backend.
          properties:
            sphere: { type: number, nullable: true }
            cylinder: { type: number, nullable: true }
            axis: { type: integer, nullable: true }
            addition: { type: string, nullable: true }
            base_curve: { type: number }
            diameter: { type: number }
        available: { type: integer, description: Stock disponible actual }
    Cart:
      type: object
      required: [items, subtotal_cents]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        subtotal_cents: { type: integer, format: int64 }
    AddressInput:
      type: object
      required: [recipient, street, ext_number, neighborhood, city, state, postal_code, phone]
      properties:
        recipient: { type: string }
        street: { type: string }
        ext_number: { type: string }
        int_number: { type: string, nullable: true }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string, minLength: 5, maxLength: 5 }
        phone: { type: string }
        is_default: { type: boolean }
    Address:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    OrderStatus:
      type: string
      enum: [pending_payment, paid, preparing, shipped, delivered, cancelled, refunded, expired]
    Order:
      type: object
      required: [id, number, status, total_cents]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total_cents: { type: integer, format: int64 }
